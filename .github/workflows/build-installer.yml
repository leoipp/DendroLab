
name: Build DendroLab Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Check SDK
        run: dotnet --info

      - name: Build installer and ZIP
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version 1.3.0 -Format Both

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DendroLab-Windows
          path: dist/1.3.0/
          if-no-files-found: error
          retention-days: 30
